<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvoiceFlow</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <h1>InvoiceFlow</h1>
  <p class="sandbox-notice">PayPal Sandbox mode: creates draft invoices only. No real payment is processed.</p>

  <section>
    <textarea id="invoice-text" placeholder="Describe the invoice in plain language, e.g. &quot;Invoice Alice at alice@example.com for $150 web design, due in 7 days&quot;"></textarea><br />
    <button id="parseBtn">Parse Invoice</button>
  </section>

  <div id="loading">Processing…</div>
  <div id="message"></div>

  <section id="invoice-form" autocomplete="off">
    <h2>Invoice Details</h2>
    <label>Recipient Name<br /><input type="text" id="recipientName" autocomplete="off" /></label>
    <label>Recipient Email<br /><input type="email" id="recipientEmail" autocomplete="off" /></label>
    <label>Currency<br /><input type="text" id="currency" autocomplete="off" /></label>
    <label>Due Date<br /><input type="date" id="dueDate" autocomplete="off" /></label>
    <h3>Line Items</h3>
    <div id="items"></div>
    <section id="confirm-section">
      <button id="createDraftBtn" disabled>Confirm &amp; Create Draft</button>
    </section>
  </section>

  <script src="/app.js"></script>
</body>
</html>
